<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Students</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  

<script>
  function logout() {
    if (confirm("Are you sure you want to log out?")) {
      location.href = "login.html";
    }
  }
</script>

<div class="sidebar"></div>

<div class="main-content students-page">
  <h1>Students</h1>
  <p class="subtitle">Students grouped by program</p>
  <input
    type="text"
    class="search-box"
    placeholder="Search students or student ID..."
    onkeyup="searchStudents()"
  >

  <div class="filters-container">
    <div class="filter-group">
      <label>Select Program</label>
      <select class="filter" id="programFilter" onchange="filterByProgram()">
        <option value="all">All Programs</option>
        <optgroup label="Senior High School">
          <option value="ABM">Accountancy, Business, and Management (ABM)</option>
          <option value="HUMSS">Humanities and Social Sciences (HUMSS)</option>
          <option value="IT-MAWD">IT in Mobile App and Web Development (IT-MAWD)</option>
          <option value="CCT">Computer and Communications Technology (CCT)</option>
          <option value="TOPER">Tourism Operations (TOPER)</option>
          <option value="CULART">Culinary Arts (CULART)</option>
        </optgroup>
        <optgroup label="Tertiary Programs">
          <option value="BSCS">Bachelor of Science in Computer Science (BSCS)</option>
          <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
          <option value="BSBA">Bachelor of Science in Business Administration (BSBA)</option>
          <option value="BSAIS">Bachelor of Science in Accounting Information System (BSAIS)</option>
          <option value="BSA">Bachelor of Science in Accountancy (BSA)</option>
          <option value="BSHM">Bachelor of Science in Hospitalilty Management (BSHM)</option>
          <option value="BACOMM">Bachelor of Arts in Communication (BACOMM)</option>
          <option value="BMMA">Bachelor of Multimedia Arts (BMMA)</option>
          <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
        </optgroup>
      </select>
    </div>
    

    <div class="filter-group">
      <label>Select Grade / Year</label>
      <select class="filter" id="yearFilter" onchange="filterByProgram()">
        <option value="all">All Levels</option>
        <optgroup label="Senior High School">
          <option value="Grade 11">Grade 11</option>
          <option value="Grade 12">Grade 12</option>
        </optgroup>
        <optgroup label="College">
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </optgroup>
      </select>
    </div>
  </div>
 <div id="bulkActionBar" style="
display:none;
background: linear-gradient(135deg,#003A8F,#003A8F);
padding:15px;
border-radius:10px;
margin-bottom:20px;
border:1px solid #d8dcff;
position: sticky;
top: 10px;
z-index: 100;
box-shadow:0 4px 10px #ffffff;
">


<div style="display: flex; align-items: center; gap: 8px;">
<select id="promoteToYear" style="
padding:7px 10px;
border-radius:6px;
border:1px solid #cfd4ff;
background:#ffffff;
">

<option value="">Move to Year</option>

<optgroup label="Senior High School">
<option value="Grade 11">Grade 11</option>
<option value="Grade 12">Grade 12</option>
</optgroup>

<optgroup label="College">
<option value="1st Year">1st Year</option>
<option value="2nd Year">2nd Year</option>
<option value="3rd Year">3rd Year</option>
<option value="4th Year">4th Year</option>
</optgroup>

</select>

<button id="bulkPromoteBtn" style="
background:#abab30;
color:white;
padding:8px 16px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
">
Update Level
</button>

</div>

<div style="display: flex; align-items: center; gap: 8px; margin-top: 10px;">
  <select id="shiftToProgram" style="
    padding:7px 10px;
    border-radius:6px;
    border:1px solid #cfd4ff;
    background:#ffffff;
  ">
    <option value="">Shift to Program</option>
    <optgroup label="Senior High School">
      <option value="ABM">Accountancy, Business, and Management (ABM)</option>
      <option value="HUMSS">Humanities and Social Sciences (HUMSS)</option>
      <option value="IT-MAWD">IT in Mobile App and Web Development (IT-MAWD)</option>
      <option value="CCT">Computer and Communications Technology (CCT)</option>
      <option value="TOPER">Tourism Operations (TOPER)</option>
      <option value="CULART">Culinary Arts (CULART)</option>
    </optgroup>
    <optgroup label="Tertiary Programs">
      <option value="BSCS">Bachelor of Science in Computer Science (BSCS)</option>
      <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
      <option value="BSBA">Bachelor of Science in Business Administration (BSBA)</option>
      <option value="BSAIS">Bachelor of Science in Accounting Information System (BSAIS)</option>
      <option value="BSA">Bachelor of Science in Accountancy (BSA)</option>
      <option value="BSHM">Bachelor of Science in Hospitalilty Management (BSHM)</option>
      <option value="BACOMM">Bachelor of Arts in Communication (BACOMM)</option>
      <option value="BMMA">Bachelor of Multimedia Arts (BMMA)</option>
      <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
    </optgroup>
  </select>



<button id="bulkShiftBtn" style="
background:#abab30;
color:white;
padding:8px 16px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
">
Shift Program
</button>
</div>
<div style="display:flex; align-items:center; gap:15px; flex-wrap: wrap;">

<label style="font-weight:600; display:flex; align-items:center; gap:6px; cursor:pointer;">
<input type="checkbox" id="selectAllCheckbox" style="transform:scale(1.2)"> Select All Visible
</label>

<span id="selectedCount" style="color:#fffafa; font-size:0.9rem;">
0 students selected
</span>

<div style="flex-grow:1"></div>

<button id="bulkDeleteBtn" style="
background:#abab30;
color:white;
padding:8px 16px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
">
Delete Selected
</button>

</div>

</div>

  <div id="studentsWrapper"></div>

  <div id="noStudentsMessage" style="display:none; text-align:center; margin-top:30px; color:#777;">
    <h3>No students enrolled</h3>
  </div>

  <div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="imgFull">
    <div id="caption"></div>
  </div>

</div>
<script src="sidebar.js"></script>
<script type="module" src="students.js"></script>

</body>
</html>
