<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History | UNISCAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #003A8F;
      --box-bg: white;
      --accent-purple: #003A8F;
      --accent-neon: #FFD400;
      --accent-blue: #FFD400;
      --accent-orange: #FFD400;
    }

    .attendance-page {
      margin: 0;
      background: linear-gradient(135deg, #f8f9fa, white);
      min-height: 100vh;
      color: #333;
      font-family: 'Segoe UI', sans-serif;
    }

    .main-content {
      margin-left: 260px;
      padding: 50px;
      display: flex;
      flex-direction: column;
    }


    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--box-bg);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid transparent;
      transition: transform 0.3s ease;
    }

    .stat-card:hover { transform: translateY(-5px); }

    .stat-card i {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 40px;
      opacity: 0.1;
      color: #003A8F;
    }

    .stat-card .label { 
      font-size: 13px; 
      opacity: 0.8; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      color: #666;
    }

    .stat-card .value { 
      font-size: 36px; 
      font-weight: bold; 
      margin-top: 10px; 
      color: #333;
    }

    .stat-card.purple { border-color: var(--accent-neon); }
    .stat-card.purple .value { color: var(--accent-neon); }
    
    .stat-card.orange { border-color: var(--accent-orange); }
    .stat-card.orange .value { color: var(--accent-orange); }

   .filter-box{
    background:white;
    padding:25px;
    border-radius:18px;
    margin-bottom:30px;

    display:grid;
    grid-template-columns:
    minmax(280px,2fr)
    minmax(220px,1.3fr)
    minmax(180px,1fr)
    minmax(180px,1fr)
    170px;

    gap:22px;
    align-items:end;

    box-shadow:0 6px 20px rgba(0,0,0,.06);
    }
    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-group label { font-size: 12px; color: #666; }

    .dark-input{
    width:100%;
    height:50px;
    padding:0 18px;
    border:2px solid #e7ebf0;
    border-radius:30px;
    background:white;
    font-size:15px;
    box-sizing:border-box;
    }
    .export-btn{
    height:50px;
    width:170px;
    justify-content:center;
    border-radius:12px;
    background:#FFD400;
    color:#003A8F;
    font-weight:700;
    white-space:nowrap;
    }

    .table-container {
      background: var(--box-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #003A8F; }
    th { padding: 18px; text-align: left; font-size: 13px; color: white; text-transform: uppercase; }
    td { padding: 16px; border-bottom: 1px solid #e9ecef; color: #333; }

    .badge-present {
      background: rgba(255,212,0,0.1);
      color: #FFD400;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #FFD400;
    }
</style>
</head>
<body class="attendance-page">

  <div class="sidebar"></div>

  <div class="main-content">
    <div class="dashboard-header" style="margin-bottom: 30px;">
      <h1 style="font-size: 32px; margin: 0;">Attendance</h1>
      <p class="subtitle" style="opacity: 0.7;">Monitor student logs with advanced filtering</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card purple">
        <i class="fas fa-calendar-day"></i>
        <span class="label" id="statLabel">Today's Present</span>
        <span class="value" id="todayCount">0</span>
      </div>
      <div class="stat-card orange">
        <i class="fas fa-filter"></i>
        <span class="label">Filtered Results</span>
        <span class="value" id="filterMatchCount">0</span>
      </div>
    </div>

    <div class="filter-box">
      <div class="filter-group">
        <label><i class="fas fa-search"></i> Search Student</label>
        <input type="text" id="searchInput" class="dark-input" placeholder="Name or Student ID...">
      </div>

      <div class="filter-group">
        <label><i class="fas fa-graduation-cap"></i> Course / Program</label>
        <select id="courseFilter" class="dark-input">
          <option value="">All Programs</option>
          <optgroup label="Senior High School">
            <option value="ABM">ABM</option>
            <option value="HUMSS">HUMSS</option>
            <option value="IT-MAWD">IT-MAWD</option>
            <option value="CCT">CCT</option>
            <option value="TOPER">TOPER</option>
            <option value="CULART">CULART</option>
          </optgroup>
          <optgroup label="Tertiary Programs">
            <option value="BSCS">BSCS</option>
            <option value="BSIT">BSIT</option>
            <option value="BSBA">BSBA</option>
            <option value="BSAIS">BSAIS</option>
            <option value="BSA">BSA</option>
            <option value="BSHM">BSHM</option>
            <option value="BACOMM">BACOMM</option>
            <option value="BMMA">BMMA</option>
            <option value="BSTM">BSTM</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-group">
        <label><i class="fas fa-layer-group"></i> Year Level</label>
        <select id="yearFilter" class="dark-input">
          <option value="">All Levels</option>
          <optgroup label="Senior High School">
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </optgroup>
          <optgroup label="College">
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-group">
        <label><i class="fas fa-calendar-alt"></i> Filter Date</label>
        <input type="date" id="dateFilter" class="dark-input">
      </div>

      <button class="export-btn" id="exportBtn">
        <i class="fas fa-file-csv"></i> Export CSV
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Student Info</th>
            <th>Program / Year</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendance-list"></tbody>
      </table>
    </div>
  </div>

  <script src="sidebar.js"></script>
  <script type="module" src="attendance.js"></script>
</body>
</html>
