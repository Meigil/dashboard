<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History | UNISCAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0f0c29;
      --box-bg: #1c1b3a;
      --accent-purple: #7f00ff;
      --accent-neon: #b721ff;
      --accent-blue: #00c6ff;
      --accent-orange: #ff8c00;
    }

    .attendance-page {
      margin: 0;
      background: linear-gradient(135deg, var(--bg-dark), #302b63);
      min-height: 100vh;
      color: white;
      font-family: 'Segoe UI', sans-serif;
    }

    .main-content {
      margin-left: 260px;
      padding: 30px;
      display: flex;
      flex-direction: column;
    }


    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--box-bg);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid transparent;
      transition: transform 0.3s ease;
    }

    .stat-card:hover { transform: translateY(-5px); }

    .stat-card i {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 40px;
      opacity: 0.2;
    }

    .stat-card .label { 
      font-size: 13px; 
      opacity: 0.8; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .stat-card .value { 
      font-size: 36px; 
      font-weight: bold; 
      margin-top: 10px; 
    }

    .stat-card.purple { border-color: var(--accent-neon); }
    .stat-card.purple .value { color: var(--accent-neon); }
    
    .stat-card.orange { border-color: var(--accent-orange); }
    .stat-card.orange .value { color: var(--accent-orange); }

    .filter-box {
      background: var(--box-bg);
      padding: 25px;
      border-radius: 15px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: 2fr 1.2fr 1fr 1fr auto;
      gap: 15px;
      align-items: flex-end;
    }

    .filter-group { display: flex; flex-direction: column; gap: 8px; }
    .filter-group label { font-size: 12px; color: rgba(255,255,255,0.7); }

    .dark-input {
      background: #2d2b6f;
      border: 1px solid #3d3b8e;
      color: white;
      padding: 12px;
      border-radius: 8px;
      outline: none;
    }

    .export-btn {
      background: linear-gradient(135deg, var(--accent-blue), #0072ff);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .table-container {
      background: var(--box-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    table { width: 100%; border-collapse: collapse; }
    thead { background: #2d2b6f; }
    th { padding: 18px; text-align: left; font-size: 13px; color: var(--accent-blue); text-transform: uppercase; }
    td { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); }

    .badge-present {
      background: rgba(0, 176, 155, 0.1);
      color: #00b09b;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      border: 1px solid #00b09b;
    }
  </style>
</head>
<body class="attendance-page">

  <div class="sidebar"></div>

  <div class="main-content">
    <div class="dashboard-header" style="margin-bottom: 30px;">
      <h1 style="font-size: 32px; margin: 0;">Attendance Intelligence</h1>
      <p class="subtitle" style="opacity: 0.7;">Monitor student logs with advanced filtering</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card purple">
        <i class="fas fa-calendar-day"></i>
        <span class="label" id="statLabel">Today's Present</span>
        <span class="value" id="todayCount">0</span>
      </div>
      <div class="stat-card orange">
        <i class="fas fa-filter"></i>
        <span class="label">Filtered Results</span>
        <span class="value" id="filterMatchCount">0</span>
      </div>
    </div>

    <div class="filter-box">
      <div class="filter-group">
        <label><i class="fas fa-search"></i> Search Student</label>
        <input type="text" id="searchInput" class="dark-input" placeholder="Name or Student ID...">
      </div>

      <div class="filter-group">
        <label><i class="fas fa-graduation-cap"></i> Course / Program</label>
        <select id="courseFilter" class="dark-input">
          <option value="">All Programs</option>
          <optgroup label="Senior High School">
            <option value="ABM">ABM</option>
            <option value="HUMSS">HUMSS</option>
            <option value="IT-MAWD">IT-MAWD</option>
            <option value="CCT">CCT</option>
            <option value="TOPER">TOPER</option>
            <option value="CULART">CULART</option>
          </optgroup>
          <optgroup label="Tertiary Programs">
            <option value="BSCS">BSCS</option>
            <option value="BSIT">BSIT</option>
            <option value="BSBA">BSBA</option>
            <option value="BSAIS">BSAIS</option>
            <option value="BSA">BSA</option>
            <option value="BSHM">BSHM</option>
            <option value="BACOMM">BACOMM</option>
            <option value="BMMA">BMMA</option>
            <option value="BSTM">BSTM</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-group">
        <label><i class="fas fa-layer-group"></i> Year Level</label>
        <select id="yearFilter" class="dark-input">
          <option value="">All Levels</option>
          <optgroup label="Senior High School">
            <option value="Grade 11">Grade 11</option>
            <option value="Grade 12">Grade 12</option>
          </optgroup>
          <optgroup label="College">
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-group">
        <label><i class="fas fa-calendar-alt"></i> Filter Date</label>
        <input type="date" id="dateFilter" class="dark-input">
      </div>

      <button class="export-btn" id="exportBtn">
        <i class="fas fa-file-csv"></i> Export CSV
      </button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date & Time</th>
            <th>Student Info</th>
            <th>Program / Year</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="attendance-list"></tbody>
      </table>
    </div>
  </div>

  <script src="sidebar.js"></script>
  <script type="module" src="attendance.js"></script>
</body>
</html>
