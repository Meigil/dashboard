<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Uniform Capture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
function logout() {
  if (confirm("Are you sure you want to log out?")) {
    location.href = "login.html";
  }
}
</script>

  <div class="sidebar"></div>

<div class="main-content">
  <h1>Uniform Capture</h1>
  <p class="subtitle">
    Capture or upload uniform images for each program
  </p>

  <div class="capture-container">

    <div class="camera-box">
      <div class="camera-feed">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
      </div>
      <button class="capture-btn" onclick="captureUniform()">Capture Uniform</button>
    </div>

    <div class="student-form">
      <h3>Select Program & Upload Uniform</h3>

      <label for="program">Program / Course</label>
      <select id="program" class="dropdown-style">
        <option value="">Select Program</option>
        <optgroup label="Senior High School">
          <option value="ABM">Accountancy, Business, and Management (ABM)</option>
          <option value="HUMSS">Humanities and Social Sciences (HUMSS)</option>
          <option value="IT-MAWD">IT in Mobile App and Web Development (IT-MAWD)</option>
          <option value="CCT">Computer and Communications Technology (CCT)</option>
          <option value="TOPER">Tourism Operations (TOPER)</option>
          <option value="CULART">Culinary Arts (CULART)</option>
        </optgroup>
        <optgroup label="Tertiary Programs">
          <option value="BSCS">Bachelor of Science in Computer Science (BSCS)</option>
          <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
          <option value="BSBA">Bachelor of Science in Business Administration (BSBA)</option>
          <option value="BSAIS">Bachelor of Science in Accounting Information System (BSAIS)</option>
          <option value="BSA">Bachelor of Science in Accountancy (BSA)</option>
          <option value="BSHM">Bachelor of Science in Hospitality Management (BSHM)</option>
          <option value="BACOMM">Bachelor of Arts in Communication (BACOMM)</option>
          <option value="BMMA">Bachelor of Multimedia Arts (BMMA)</option>
          <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
        </optgroup>
      </select>

      <label>Upload Uniform Image</label>
      <input type="file" id="uploadImage" accept="image/*">

      <button class="next-btn" onclick="goToLabel()">Next: Label Uniform</button>
    </div>

  </div>
</div>

<script src="sidebar.js"></script>
<script type="module" src="uniformcapture.js"></script>
</body>
</html>
