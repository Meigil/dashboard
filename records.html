<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Records | UNISCAN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #003A8F;
            --box-bg: white;
            --accent-purple: #FFD400;
            --accent-neon: #FFD400;
            --accent-blue: #FFD400;
            --accent-green: #FFD400;
            --accent-red: #f8d7da;
            --input-bg: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f8f9fa, white);
            min-height: 100vh;
            color: #333;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
        }

        .main-content { 
            margin-left: 260px; 
            padding: 40px; 
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #003A8F;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--box-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-bottom: 4px solid var(--accent-neon);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card span:first-child {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #666;
            font-weight: 600;
        }

        .stat-card .value { 
            font-size: 2.2rem; 
            font-weight: 800; 
            display: block; 
            margin-top: 5px; 
            color: var(--accent-blue); 
        }

        .filter-box {
            background: var(--box-bg);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .filter-group {
            flex: 1;
            min-width: 150px;
        }

        .filter-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: bold;
            color: #003A8F;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .dark-input {
            background: var(--input-bg);
            border: 1px solid #e9ecef;
            color: #333;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            outline: none;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        .dark-input:focus {
            border-color: var(--accent-blue);
        }

        .export-btn {
            background: linear-gradient(135deg, var(--accent-blue), #ffed4e);
            color: #003A8F; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
            height: 45px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 0.3s, transform 0.2s;
        }

        .export-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }


        .table-container {
            background: var(--box-bg);
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            min-width: 800px;
        }

        thead { background: #003A8F; }

        th { 
            padding: 18px 15px; 
            color: white; 
            text-transform: uppercase; 
            font-size: 0.75rem; 
            text-align: left;
            letter-spacing: 1px;
        }

        td { 
            padding: 15px; 
            border-bottom: 1px solid #e9ecef; 
            font-size: 0.9rem; 
            color: #333;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .ok { color: #28a745; font-weight: 600; }
        .violation { color: #dc3545; font-weight: 600; }

        .img-proof {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .img-proof:hover { 
            transform: scale(1.2); 
            border-color: var(--accent-blue); 
        }

        /* Modal Layout */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 9999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        @media (max-width: 1024px) {
            .main-content { margin-left: 0; padding: 20px; }
            .filter-box { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body class="attendance-page">

    <div class="sidebar">
        </div>

    <div class="main-content">
        <h1>Attendance & Student Records</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <span>Today's Logs</span>
                <span class="value" id="todayCount">0</span>
            </div>
            
            <div class="stat-card" style="border-bottom-color: var(--accent-green);">
                <span>Complete Uniform</span>
                <span class="value" id="completeCount" style="color: var(--accent-green);">0</span>
            </div>

            <div class="stat-card" style="border-bottom-color: var(--accent-red);">
                <span>With Violations</span>
                <span class="value" id="violationCount" style="color: var(--accent-red);">0</span>
            </div>

            <div class="stat-card">
                <span>Filtered Results</span>
                <span class="value" id="filterMatchCount">0</span>
            </div>
        </div>

        <div class="filter-box">
            <div class="filter-group">
                <label>Search Student</label>
                <input type="text" id="searchInput" class="dark-input" placeholder="Name or ID...">
            </div>
            <div class="filter-group">
                <label>Program</label>
                <select id="courseFilter" class="dark-input">
                    <option value="">All Programs</option>
                    <optgroup label="Senior High School">
                        <option value="ABM">ABM</option>
                        <option value="HUMSS">HUMSS</option>
                        <option value="IT-MAWD">IT-MAWD</option>
                        <option value="CCT">CCT</option>
                        <option value="TOPER">TOPER</option>
                        <option value="CULART">CULART</option>
                    </optgroup>
                    <optgroup label="College">
                        <option value="BSCS">BSCS</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSBA">BSBA</option>
                        <option value="BSAIS">BSAIS</option>
                        <option value="BSA">BSA</option>
                        <option value="BSHM">BSHM</option>
                        <option value="BACOMM">BACOMM</option>
                        <option value="BMMA">BMMA</option>
                        <option value="BSTM">BSTM</option>
                    </optgroup>
                </select>
            </div>
            <div class="filter-group">
                <label>Year Level</label>
                <select id="yearFilter" class="dark-input">
                    <option value="">All Levels</option>
                    <option value="Grade 11">Grade 11</option>
                    <option value="Grade 12">Grade 12</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                    <option value="4th Year">4th Year</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Date</label>
                <input type="date" id="dateFilter" class="dark-input">
            </div>
            <button class="export-btn" id="exportBtn">
                <i class="fas fa-download"></i> EXPORT
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Proof</th>
                        <th>Date & Time</th>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Program/Year</th>
                        <th>Status</th>
                        <th>Violation</th>
                    </tr>
                </thead>
                <tbody id="recordsBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div id="imageModal" onclick="this.style.display='none'">
        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%;">
            <img id="modalImg" src="" style="max-width:85%; max-height:80%; border-radius:12px; border:2px solid var(--accent-blue);">
            <div id="modalCaption" style="color:white; font-size:1.2rem; margin-top:20px; font-weight:bold;"></div>
            <p style="color:rgba(255,255,255,0.5); font-size:0.9rem; margin-top:10px;">Click anywhere to close</p>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script type="module" src="records.js"></script>
</body>
</html>
