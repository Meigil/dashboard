<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Face Capture</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <script>
    function logout() {
      if (confirm("Are you sure you want to log out?")) {
        location.href = "login.html";
      }
    }
  </script>


  <div class="sidebar">
    <h2>UNISCAN</h2>
    <ul>
      <li onclick="location.href='index.html'"> Dashboard</li>
      <li class="active" onclick="location.href='capture.html'"> Face Capture</li>
      <li onclick="location.href='students.html'"> Students</li>
      <li onclick="location.href='records.html'"> Student Records</li>
      <li onclick="location.href='violations.html'"> Violations</li>
      <li onclick="location.href='guidance.html'"> Guidance</li>
      <li> Admin </li>
      <li class="logout" onclick="logout()"> Log Out</li>
    </ul>
  </div>

  

  <div class="main-content">

    <h1>Student Identity Enrollment</h1>
    <p class="subtitle">
      Capture student face image for facial recognition verification
    </p>

    <div class="capture-container">


      <div class="camera-box">
        <div class="camera-feed">
          <video id="video" autoplay playsinline></video>
          <canvas id="canvas" style="display:none;"></canvas>
        </div>
        <button class="capture-btn" onclick="captureImage()">Capture Image</button>
      </div>


        <div class="student-form">
  <h3>Student Information</h3>

  <label for="studentId">Student ID</label>
  <input type="text" id="studentId" placeholder="">

  <label for="fullName">Full Name</label>
  <input type="text" id="fullName" placeholder="">

  <label for="course">Program / Course</label>
  <select id="course" class="dropdown-style">
    <option value="">Select Program</option>
    <optgroup label="Senior High School">
      <option value="ABM">Accountancy, Business, and Management (ABM)</option>
      <option value="HUMSS">Humanities and Social Sciences (HUMSS)</option>
      <option value="IT-MAWD">IT in Mobile App and Web Development (IT-MAWD)</option>
      <option value="CCT">Computer and Communications Technology (CCT)</option>
      <option value="TOPER">Tourism Operations (TOPER)</option>
      <option value="CULART">Culinary Arts (CULART)</option>
    </optgroup>
    <optgroup label="Tertiary Programs">
      <option value="BSCS">Bachelor of Science in Computer Science (BSCS)</option>
      <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
      <option value="BSBA">Bachelor of Science in Business Administration (BSBA)</option>
      <option value="BSAIS">Bachelor of Science in Accounting Information System (BSAIS)</option>
      <option value="BSA">Bachelor of Science in Accountancy (BSA)</option>
      <option value="BSHM">Bachelor of Science in Hospitalilty Management (BSHM)</option>
      <option value="BACOMM">Bachelor of Arts in Communication (BACOMM)</option>
      <option value="BMMA">Bachelor of Multimedia Arts (BMMA)</option>
      <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
    </optgroup>
  </select>
<label for="yearLevel">Grade / Year Level</label>
<select id="yearLevel" class="dropdown-style">
  <option value="">Select Grade / Year</option>

  <optgroup label="Senior High School">
    <option value="Grade 11">Grade 11</option>
    <option value="Grade 12">Grade 12</option>
  </optgroup>

  <optgroup label="College">
    <option value="1st Year">1st Year</option>
    <option value="2nd Year">2nd Year</option>
    <option value="3rd Year">3rd Year</option>
    <option value="4th Year">4th Year</option>
  </optgroup>
</select>

  

<label>Captured Image</label>

<label for="uploadImage">Upload Image</label>
<input type="file" id="uploadImage" accept="image/*">

<div class="image-preview" id="imagePreview">
  No image captured
</div>


        <button class="save-btn" onclick="saveStudent()">Save Student Profile</button>
      </div>

    </div>

  </div>


<script type="module" src="capture.js"></script>



</body>
</html>
