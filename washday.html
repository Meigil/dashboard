<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Washday </title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        body {
            display: flex;
            background-color: #f4f7f6;
            color: #050505;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* SIDEBAR FIX */
         .sidebar {
            width: 240px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #031736;
            padding: 20px;
            z-index: 1000;
            border-right: 1px solid rgba(255,255,255,0.1);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #FFD400;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
            border-radius: 8px;
        }

        .sidebar li {
            padding: 12px 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.85;
            color: rgba(255,255,255,0.9);
            transition: all 0.3s ease;
        }

        .sidebar li:hover,
        .sidebar .active {
            background: rgba(255,212,0,0.2);
            opacity: 1;
            border-left: 3px solid #FFD400;
            transform: translateX(4px);
        }

        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 900px; 
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }

        h2 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .description {
            font-size: 0.95rem;
            color: #030303;
            margin-bottom: 30px;
        }


        .day-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); 
            gap: 12px;
            margin-bottom: 30px;
        }

        .day-item {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }

        .day-item:hover {
            border-color: #2196f3;
            background-color: #f0f7ff;
        }

        .day-item input {
            width: 20px;
            height: 20px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .day-item label {
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            color: #444;
        }

        .day-item.active {
            background-color: #e3f2fd;
            border-color: #2196f3;
            color: #1976d2;
        }

        .day-item.active label {
            color: #1976d2;
        }


        .action-area {
            display: flex;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #eee;
            padding-top: 25px;
        }

        .save-btn {
            background-color: #2196f3;
            color:#031736;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .save-btn:hover {
            background-color: #1565c0;
        }

        #statusMsg {
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <div class="sidebar"></div>

<div class="main-content">
    <div class="container">
        <h2 style="color: #2c3e50; margin-bottom: 8px;">Washday Schedule</h2>
        <p style="color: #666; font-size: 0.95rem; margin-top: 0;">
            Select the days for washday attire. On these days, the system will only check the <b>Lanyard</b>.
        </p>

            <div class="day-grid" id="dayGrid">
                </div>

            <div class="action-area">
                <button class="save-btn" onclick="saveWashdays()">SAVE </button>
                <div id="statusMsg"></div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import {
        getFirestore,
        doc,
        getDoc
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    import { renderSidebar } from "./sidebar.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBmVP7R5XnvqobdxiRv-LpHswhCCVRggX4",
        authDomain: "thesissystem-921ef.firebaseapp.com",
        projectId: "thesissystem-921ef",
        storageBucket: "thesissystem-921ef.firebasestorage.app",
        messagingSenderId: "62118219774",
        appId: "1:62118219774:web:1b58fcbf0f4e4d0f87faaf"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const email = user.email ? user.email.toLowerCase().trim() : "";

  try {
    const userDocRef = doc(db, "users", email);
    const userSnap = await getDoc(userDocRef);

    if (userSnap.exists()) {
      const userRole = userSnap.data().role;

   
      if (userRole !== "admin") {
        alert("Your account role is not authorized.");
        window.location.href = "login.html";
        return; 
      }

      renderSidebar(userRole);

    } else {
      console.error("User record not found.");
      alert("Your account role is not authorized.");
      window.location.href = "login.html";
    }

  } catch (error) {
    console.error("Error fetching user role:", error);
    window.location.href = "login.html";
  }
});
</script>
    <script>
        const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        const dayGrid = document.getElementById("dayGrid");
        days.forEach(day => {
            dayGrid.innerHTML += `
                <div class="day-item" id="item-${day}" onclick="toggleCheckbox('${day}')">
                    <input type="checkbox" id="${day}" value="${day}" class="day-checkbox" 
                           onclick="event.stopPropagation(); updateStyle('${day}')">
                    <label for="${day}">${day}</label>
                </div>
            `;
        });


        function toggleCheckbox(day) {
            const cb = document.getElementById(day);
            cb.checked = !cb.checked;
            updateStyle(day);
        }

        function updateStyle(day) {
            const cb = document.getElementById(day);
            const item = document.getElementById(`item-${day}`);
            if(cb.checked) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        }


        window.onload = () => {
            const saved = JSON.parse(localStorage.getItem("washdays") || "[]");
            saved.forEach(day => {
                const cb = document.getElementById(day);
                if(cb) {
                    cb.checked = true;
                    updateStyle(day);
                }
            });
        };

        function saveWashdays() {
            const selected = Array.from(document.querySelectorAll('.day-checkbox:checked'))
                                  .map(cb => cb.value);
            
            localStorage.setItem("washdays", JSON.stringify(selected));
            
            const msg = document.getElementById("statusMsg");
            msg.textContent = "Successfully Saved!";
            
            setTimeout(() => { msg.textContent = ""; }, 3000);
        }
    </script>
</body>
</html>
