<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniform Violations | UNISCAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>

    .flagged-status {
      background: #f8d7da;
      color: #721c24;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .pending-status {
      color: #FFD400;
      font-weight: bold;
    }
    .count-circle {
      background: #003A8F;
      color: white;
      padding: 2px 8px;
      border-radius: 50%;
      font-size: 0.85rem;
      border: 1px solid rgba(0,58,143,0.2);
    }


    #imageModal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,58,143,0.95);
      overflow-y: auto;
      padding: 60px 20px;
    }

    .history-container {
      max-width: 800px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease-out;
    }

    .history-card {
      display: flex;
      align-items: center;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 12px;
    }

    .history-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #FFD400;
      cursor: zoom-in;
    }

    .history-info { margin-left: 20px; flex-grow: 1; color: #333; }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 35px;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    #zoomModal {
      display: none;
      position: fixed;
      z-index: 10001;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center; align-items: center;
      cursor: zoom-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
  <h1>Uniform Violations</h1>
  <p class="subtitle">Repeat offenders summary and student history</p>

<div class="filter-box" style="margin-bottom: 20px;">

  <input
    type="text"
    id="studentSearch"
    class="search-box"
    placeholder="Search ID, Name, or Program..."
  >

  <div class="filters-container">

    <div class="filter-group">
      <label>Select Program</label>
      <select class="filter" id="programFilter">
        <option value="all">All Programs</option>

        <optgroup label="Senior High School">
          <option value="ABM">Accountancy, Business, and Management (ABM)</option>
          <option value="HUMSS">Humanities and Social Sciences (HUMSS)</option>
          <option value="IT-MAWD">IT in Mobile App and Web Development (IT-MAWD)</option>
          <option value="CCT">Computer and Communications Technology (CCT)</option>
          <option value="TOPER">Tourism Operations (TOPER)</option>
          <option value="CULART">Culinary Arts (CULART)</option>
        </optgroup>

        <optgroup label="Tertiary Programs">
          <option value="BSCS">Bachelor of Science in Computer Science (BSCS)</option>
          <option value="BSIT">Bachelor of Science in Information Technology (BSIT)</option>
          <option value="BSBA">Bachelor of Science in Business Administration (BSBA)</option>
          <option value="BSAIS">Bachelor of Science in Accounting Information System (BSAIS)</option>
          <option value="BSA">Bachelor of Science in Accountancy (BSA)</option>
          <option value="BSHM">Bachelor of Science in Hospitality Management (BSHM)</option>
          <option value="BACOMM">Bachelor of Arts in Communication (BACOMM)</option>
          <option value="BMMA">Bachelor of Multimedia Arts (BMMA)</option>
          <option value="BSTM">Bachelor of Science in Tourism Management (BSTM)</option>
        </optgroup>

      </select>
    </div>


    <div class="filter-group">
      <label>Select Grade / Year</label>

      <select class="filter" id="yearFilter">
        <option value="all">All Levels</option>

        <optgroup label="Senior High School">
          <option value="Grade 11">Grade 11</option>
          <option value="Grade 12">Grade 12</option>
        </optgroup>

        <optgroup label="College">
          <option value="1st Year">1st Year</option>
          <option value="2nd Year">2nd Year</option>
          <option value="3rd Year">3rd Year</option>
          <option value="4th Year">4th Year</option>
        </optgroup>

      </select>
    </div>

  </div>

</div>

<div id="violationsWrapper"></div>

<div id="noViolationsMessage"
     style="display:none; text-align:center; margin-top:50px; color:#777;">
  <h3>No violations found</h3>
</div>
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Program & Year</th>
          <th>Total Records</th>
          <th>Offense Category</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="violationTableBody"></tbody>
    </table>
  </div>
</div>

<div id="imageModal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modalContent" class="history-container"></div>
</div>

<div id="zoomModal" onclick="this.style.display='none'">
    <img id="zoomedImg" src="" style="max-width: 90%; max-height: 90%; border-radius: 10px; border: 3px solid #00c6ff;">
</div>

<script type="module" src="sidebar.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
  import { 
    getFirestore, 
    collection, 
    query, 
    orderBy, 
    onSnapshot,
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBmVP7R5XnvqobdxiRv-LpHswhCCVRggX4",
    authDomain: "thesissystem-921ef.firebaseapp.com",
    projectId: "thesissystem-921ef",
    storageBucket: "thesissystem-921ef.appspot.com",
    messagingSenderId: "62118219774",
    appId: "1:62118219774:web:1b58fcbf0f4e4d0f87faaf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.href = "login.html";
    return;
  }

  const email = user.email ? user.email.toLowerCase().trim() : "";

  try {
    const userDocRef = doc(db, "users", email);
    const userSnap = await getDoc(userDocRef);

    if (userSnap.exists()) {
      const userRole = userSnap.data().role;

   
      if (userRole !== "guidance") {
        alert("Your account role is not authorized.");
        window.location.href = "login.html";
        return; 
      }

      renderSidebar(userRole);

    } else {
      console.error("User record not found.");
      alert("Your account role is not authorized.");
      window.location.href = "login.html";
    }

  } catch (error) {
    console.error("Error fetching user role:", error);
    window.location.href = "login.html";
  }
});

    let allRecords = [];
    const q = query(collection(db, "attendance"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        allRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderViolations();
    });
async function renderViolations() {
        const tbody = document.getElementById("violationTableBody");
        const searchFilter = document.getElementById("studentSearch").value.toLowerCase();
        tbody.innerHTML = "";

        const grouped = {};
        
allRecords.forEach(rec => {

    const hasViolation =
        rec.violationType &&
        rec.violationType !== "None";

    if (hasViolation && rec.studentId) {
                if (!grouped[rec.studentId]) {
                    grouped[rec.studentId] = {
                        name: rec.studentName || "Unknown",
                        id: rec.studentId,
                        program: rec.programLevel || "N/A",
                        logs: []
                    };
                }
                grouped[rec.studentId].logs.push(rec);
            }
        });

  for (const student of Object.values(grouped)) {
            const matchesSearch = student.id.toLowerCase().includes(searchFilter) || 
                                 student.name.toLowerCase().includes(searchFilter) ||
                                 student.program.toLowerCase().includes(searchFilter);
if (matchesSearch) {

const lastCounseled = student.logs
    .map(log => log.counseledAt ? new Date(log.counseledAt) : null)
    .filter(Boolean)
    .sort((a, b) => b - a)[0];

const activeLogs = lastCounseled
    ? student.logs.filter(log =>
          log.timestamp?.toDate?.() > lastCounseled &&
          log.violationType &&
          log.violationType !== "None"
      )
    : student.logs.filter(log =>
          log.violationType &&
          log.violationType !== "None"
      );

    const count = activeLogs.length;
    const isFlagged = count >= 3;
    const offense = getOffenseCategory(count);

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="color:#00c6ff; font-weight:bold;">${student.id}</td>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.program}</td>
                  <td>
    <span class="count-circle" style="${isFlagged ? 'background:#e74c3c' : ''}">
        ${count}
    </span>
</td>

<td style="font-size: 0.9rem;">
    ${offense}
</td>

<td>
    ${isFlagged 
        ? `<span class="flagged-status">Flagged</span>` 
        : `<span class="pending-status">Pending</span>`}
</td>
                    <td>
                        <button onclick='viewDetails(${JSON.stringify(student.logs.map(l => ({
                            date: l.dateString,
                            time: l.timeString,
                            img: l.capturedImage,
                            type: l.violationType
                        }))).replace(/'/g, "&apos;")}, "${student.name}")' 
                        style="background:#2d2b6f; border:1px solid #00c6ff; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600;">
                            View Details
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
               }
    }

    window.viewDetails = (logs, name) => {
        const modal = document.getElementById("imageModal");
        const container = document.getElementById("modalContent");

        let html = `
            <div style="margin-bottom:30px;">
                <h2 style="color:white; margin-bottom:5px;">Violation History</h2>
                <p style="color:#00c6ff; font-weight:bold;">${name}</p>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
            </div>
        `;
        
logs
.sort((a, b) => new Date(b.date) - new Date(a.date))
.forEach(log => {
            html += `
                <div class="history-card">
                    <img src="${log.img || 'https://via.placeholder.com/80'}" class="history-img" onclick="zoomImage('${log.img}')">
                    <div class="history-info">
                        <div style="color:#f1c40f; font-weight:bold;">${log.type}</div>
                        <div style="font-size:0.9rem; margin-top:5px; opacity:0.8;">${log.date} | ${log.time}</div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        modal.style.display = "block";
        document.body.style.overflow = "hidden"; 
    }

    window.closeModal = () => {
        document.getElementById("imageModal").style.display = "none";
        document.body.style.overflow = "auto";
    }

    window.zoomImage = (src) => {
        const zoomModal = document.getElementById("zoomModal");
        const zoomedImg = document.getElementById("zoomedImg");
        zoomedImg.src = src;
        zoomModal.style.display = "flex";
    }

    document.getElementById("studentSearch").addEventListener("input", renderViolations);
    function getOffenseCategory(count) {
    if (count === 0) {
        return "No Record";
    }

    if (count === 1) {
        return "1st Offense - Verbal Warning (spoken reminder)";
    }

    if (count === 2) {
        return "2nd Offense - Written Reprimand (formal written warning)";
    }

    return "3rd Offense - Written Reprimand / Corrective Action (suspension for at least 3 school days and up to 7 school days)";
}
</script>
</body>
</html>
