<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniform Violations | UNISCAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>

    .flagged-status {
      background: #f8d7da;
      color: #721c24;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
    }
    .pending-status {
      color: #FFD400;
      font-weight: bold;
    }
    .count-circle {
      background: #003A8F;
      color: white;
      padding: 2px 8px;
      border-radius: 50%;
      font-size: 0.85rem;
      border: 1px solid rgba(0,58,143,0.2);
    }


    #imageModal {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,58,143,0.95);
      overflow-y: auto;
      padding: 60px 20px;
    }

    .history-container {
      max-width: 800px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease-out;
    }

    .history-card {
      display: flex;
      align-items: center;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 12px;
    }

    .history-img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #FFD400;
      cursor: zoom-in;
    }

    .history-info { margin-left: 20px; flex-grow: 1; color: #333; }

    .close-btn {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 35px;
      color: white;
      cursor: pointer;
      z-index: 10000;
    }

    #zoomModal {
      display: none;
      position: fixed;
      z-index: 10001;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      justify-content: center; align-items: center;
      cursor: zoom-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
  <h1>Uniform Violations</h1>
  <p class="subtitle">Repeat offenders summary and student history</p>

  <div class="filter-box" style="margin-bottom: 20px; display: flex; gap: 10px;">
    <input type="text" id="studentSearch" class="dark-input" placeholder="Search ID, Name, or Program..." style="max-width: 400px;">
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Name</th>
          <th>Program & Year</th>
          <th>Total Records</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="violationTableBody"></tbody>
    </table>
  </div>
</div>

<div id="imageModal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modalContent" class="history-container"></div>
</div>

<div id="zoomModal" onclick="this.style.display='none'">
    <img id="zoomedImg" src="" style="max-width: 90%; max-height: 90%; border-radius: 10px; border: 3px solid #00c6ff;">
</div>

<script src="sidebar.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBmVP7XnvqobdxiRv-LpHswhCCVRggX4",
        authDomain: "thesissystem-921ef.firebaseapp.com",
        projectId: "thesissystem-921ef",
        storageBucket: "thesissystem-921ef.appspot.com",
        messagingSenderId: "62118219774",
        appId: "1:62118219774:web:1b58fcbf0f4e4d0f87faaf"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allRecords = [];
    const q = query(collection(db, "attendance"), orderBy("timestamp", "desc"));

    onSnapshot(q, (snapshot) => {
        allRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderViolations();
    });

    function renderViolations() {
        const tbody = document.getElementById("violationTableBody");
        const searchFilter = document.getElementById("studentSearch").value.toLowerCase();
        tbody.innerHTML = "";

        const grouped = {};
        
        allRecords.forEach(rec => {
            if (rec.status !== "Complete" && rec.studentId) {
                if (!grouped[rec.studentId]) {
                    grouped[rec.studentId] = {
                        name: rec.studentName || "Unknown",
                        id: rec.studentId,
                        program: rec.programLevel || "N/A",
                        logs: []
                    };
                }
                grouped[rec.studentId].logs.push(rec);
            }
        });

        Object.values(grouped).forEach(student => {
            const matchesSearch = student.id.toLowerCase().includes(searchFilter) || 
                                 student.name.toLowerCase().includes(searchFilter) ||
                                 student.program.toLowerCase().includes(searchFilter);

            if (matchesSearch) {
                const count = student.logs.length;
                const isFlagged = count >= 3;

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="color:#00c6ff; font-weight:bold;">${student.id}</td>
                    <td><strong>${student.name}</strong></td>
                    <td>${student.program}</td>
                    <td><span class="count-circle" style="${isFlagged ? 'background:#e74c3c' : ''}">${count}</span></td>
<td>
    ${isFlagged 
        ? `<span class="flagged-status">Flagged</span>` 
        : `<span class="pending-status">Pending</span>`}
</td>
                    <td>
                        <button onclick='viewDetails(${JSON.stringify(student.logs.map(l => ({
                            date: l.dateString,
                            time: l.timeString,
                            img: l.capturedImage,
                            type: l.violationType
                        }))).replace(/'/g, "&apos;")}, "${student.name}")' 
                        style="background:#2d2b6f; border:1px solid #00c6ff; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:600;">
                            View Details
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            }
        });
    }

    window.viewDetails = (logs, name) => {
        const modal = document.getElementById("imageModal");
        const container = document.getElementById("modalContent");

        let html = `
            <div style="margin-bottom:30px;">
                <h2 style="color:white; margin-bottom:5px;">Violation History</h2>
                <p style="color:#00c6ff; font-weight:bold;">${name}</p>
                <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:15px 0;">
            </div>
        `;
        
        logs.forEach(log => {
            html += `
                <div class="history-card">
                    <img src="${log.img || 'https://via.placeholder.com/80'}" class="history-img" onclick="zoomImage('${log.img}')">
                    <div class="history-info">
                        <div style="color:#f1c40f; font-weight:bold;">${log.type}</div>
                        <div style="font-size:0.9rem; margin-top:5px; opacity:0.8;">${log.date} | ${log.time}</div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        modal.style.display = "block";
        document.body.style.overflow = "hidden"; 
    }

    window.closeModal = () => {
        document.getElementById("imageModal").style.display = "none";
        document.body.style.overflow = "auto";
    }

    window.zoomImage = (src) => {
        const zoomModal = document.getElementById("zoomModal");
        const zoomedImg = document.getElementById("zoomedImg");
        zoomedImg.src = src;
        zoomModal.style.display = "flex";
    }

    document.getElementById("studentSearch").addEventListener("input", renderViolations);
</script>
</body>
</html>
