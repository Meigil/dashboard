<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uniform Inventory | Admin</title>
  
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.05) 0, transparent 50%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR SPACE */
    .sidebar { min-width: 260px; }

    .main-content {
      flex-grow: 1;
      padding: 40px 60px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    /* FILTER SECTION */
    .filter-row {
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    #programFilter {
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      min-width: 250px;
      cursor: pointer;
    }

    /* CARDS GRID */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .card {
      background: rgba(30, 41, 59, 0.5);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: #3b82f6;
      background: rgba(30, 41, 59, 0.8);
    }

    .card h3 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      color: #3b82f6;
    }

    .uniform-img-container {
      width: 100%;
      height: 400px;
      border-radius: 16px;
      overflow: hidden;
      background: #020617;
    }

    .uniform-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MODAL STYLING */
    .modal {
      display: none; 
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(15px);
    }

    .modal-content {
      background: #1e293b;
      margin: 5% auto;
      padding: 30px;
      width: 90%;
      max-width: 800px;
      border-radius: 24px;
      border: 1px solid #334155;
      position: relative;
    }

    .close-modal {
      position: absolute;
      right: 25px;
      top: 15px;
      color: #94a3b8;
      font-size: 35px;
      cursor: pointer;
    }

    .modal-img {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      background: #020617;
    }

    .modal-header { margin-bottom: 20px; text-align: center; }
    .modal-header h2 { color: #3b82f6; }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 100px; color: #475569; }
  </style>
</head>
<body>

<div class="sidebar"></div>

<div class="main-content">
  <h1>Saved Uniforms</h1>
  <p class="subtitle">Official reference images per academic program</p>

  <div class="filter-row">
    <label>Filter by:</label>
    <select id="programFilter">
      <option value="">All Programs</option>
      <optgroup label="Senior High School">
        <option value="ABM">ABM</option>
        <option value="HUMSS">HUMSS</option>
        <option value="IT-MAWD">IT-MAWD</option>
        <option value="CCT">CCT</option>
        <option value="TOPER">TOPER</option>
        <option value="CULART">CULART</option>
      </optgroup>
      <optgroup label="Tertiary Programs">
        <option value="BSCS">BSCS</option>
        <option value="BSIT">BSIT</option>
        <option value="BSBA">BSBA</option>
        <option value="BSAIS">BSAIS</option>
        <option value="BSA">BSA</option>
        <option value="BSHM">BSHM</option>
        <option value="BACOMM">BACOMM</option>
        <option value="BMMA">BMMA</option>
        <option value="BSTM">BSTM</option>
      </optgroup>
    </select>
  </div>

  <div class="cards" id="uniformCards"></div>
</div>

<div id="uniformModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <div class="modal-header">
      <h2 id="modalTitle">Program</h2>
    </div>
    <img id="modalImg" class="modal-img" src="">
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBmVP7R5XnvqobdxiRv-LpHswhCCVRggX4",
  authDomain: "thesissystem-921ef.firebaseapp.com",
  projectId: "thesissystem-921ef",
  storageBucket: "thesissystem-921ef.appspot.com",
  messagingSenderId: "62118219774",
  appId: "1:62118219774:web:1b58fcbf0f4e4d0f87faaf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const uniformCards = document.getElementById("uniformCards");
const programFilter = document.getElementById("programFilter");
const modal = document.getElementById("uniformModal");
const modalImg = document.getElementById("modalImg");
const modalTitle = document.getElementById("modalTitle");
const closeModal = document.querySelector(".close-modal");

async function loadUniforms() {
  uniformCards.innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>Loading uniforms...</p>";
  
  try {
    const snapshot = await getDocs(collection(db, "uniforms"));
    uniformCards.innerHTML = "";

    if (snapshot.empty) {
      uniformCards.innerHTML = "<div class='empty-state'>No uniforms found.</div>";
      return;
    }

    snapshot.forEach(doc => {
      const data = doc.data();
      const program = data.program || "Unknown";

      const card = document.createElement("div");
      card.classList.add("card"); 
      card.dataset.program = program;

      card.innerHTML = `
        <h3>${program}</h3>
        <div class="uniform-img-container">
          <img src="${data.imageBase64}" alt="${program}">
        </div>
      `;

      // CLICK EVENT: Open the Modal
      card.addEventListener('click', () => {
        modalTitle.innerText = program + " Reference";
        modalImg.src = data.imageBase64;
        modal.style.display = "block";
      });

      uniformCards.appendChild(card);
    });
  } catch (error) {
    console.error("Error loading uniforms:", error);
  }
}

// CLOSE MODAL LOGIC
closeModal.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target == modal) modal.style.display = "none"; };

// FILTER LOGIC
programFilter.addEventListener("change", () => {
  const selected = programFilter.value;
  document.querySelectorAll(".card").forEach(card => {
    card.style.display = (!selected || card.dataset.program === selected) ? "block" : "none";
  });
});

loadUniforms();
</script>
<script src="sidebar.js"></script>
</body>
</html>
